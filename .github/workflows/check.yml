# Revisión manual: verifica fotos y genera capturas del prototipo.
name: Revisar prototipo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p shots && node scripts/check-photos.mjs | tee shots/fotos.txt
      - run: npx -y playwright@1.48.2 install --with-deps chromium && npm i --no-save playwright@1.48.2 && node scripts/screens.mjs && node scripts/live.mjs https://nanifranco.github.io/Arbo/ | tee shots/live.txt
      - name: Publicar capturas en la rama revision
        run: |
          cd shots
          git init -q -b revision
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Capturas de revisión"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" revision
